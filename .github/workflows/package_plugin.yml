name: 📦 Package Plugin

on:
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
      plugin_version:
        required: true
        type: string
      is_release:
        required: true
        type: boolean

jobs:
  package:
    name: 📦 Package Plugin
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          submodules: recursive

      - name: Import dependency versions
        shell: bash
        run: |
          grep -v '^#' deps.env | grep -v '^$' >> "$GITHUB_ENV"

      # Note: We define explicit restoration for each matrix combination.
      # This is the "Rigorosa" way to ensure full plugin packaging.

      - name: Restore Windows x86_64 Editor
        id: cache_windows_x86_64_editor
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          fail-on-cache-miss: true
          path: tmp-builds/out/
          key: tmp-bin-${{ github.run_id }}-windows-x86_64-single-editor
      - name: Restore Windows x86_64 Release
        id: cache_windows_x86_64_release
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          fail-on-cache-miss: true
          path: tmp-builds/out/
          key: tmp-bin-${{ github.run_id }}-windows-x86_64-single-template_release
      - name: Restore Linux x86_64 Editor
        id: cache_linux_x86_64_editor
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          fail-on-cache-miss: true
          path: tmp-builds/out/
          key: tmp-bin-${{ github.run_id }}-linux-x86_64-single-editor
      - name: Restore Linux x86_64 Release
        id: cache_linux_x86_64_release
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          fail-on-cache-miss: true
          path: tmp-builds/out/
          key: tmp-bin-${{ github.run_id }}-linux-x86_64-single-template_release
      - name: Restore Linux arm64 Editor
        id: cache_linux_arm64_editor
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          fail-on-cache-miss: true
          path: tmp-builds/out/
          key: tmp-bin-${{ github.run_id }}-linux-arm64-single-editor
      - name: Restore Linux arm64 Release
        id: cache_linux_arm64_release
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          fail-on-cache-miss: true
          path: tmp-builds/out/
          key: tmp-bin-${{ github.run_id }}-linux-arm64-single-template_release
      - name: Restore macOS Universal Editor
        id: cache_macos_universal_editor
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          fail-on-cache-miss: true
          path: tmp-builds/out/
          key: tmp-bin-${{ github.run_id }}-macos-universal-single-editor
      - name: Restore macOS Universal Release
        id: cache_macos_universal_release
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          fail-on-cache-miss: true
          path: tmp-builds/out/
          key: tmp-bin-${{ github.run_id }}-macos-universal-single-template_release

      - name: Restore Android arm64 Editor
        id: cache_android_arm64_editor
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          fail-on-cache-miss: true
          path: tmp-builds/out/
          key: tmp-bin-${{ github.run_id }}-android-arm64-single-editor
      - name: Restore Android arm64 Release
        id: cache_android_arm64_release
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          fail-on-cache-miss: true
          path: tmp-builds/out/
          key: tmp-bin-${{ github.run_id }}-android-arm64-single-template_release
      - name: Restore Android x86_64 Editor
        id: cache_android_x86_64_editor
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          fail-on-cache-miss: true
          path: tmp-builds/out/
          key: tmp-bin-${{ github.run_id }}-android-x86_64-single-editor
      - name: Restore Android x86_64 Release
        id: cache_android_x86_64_release
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          fail-on-cache-miss: true
          path: tmp-builds/out/
          key: tmp-bin-${{ github.run_id }}-android-x86_64-single-template_release
      - name: Restore iOS arm64 Editor
        id: cache_ios_arm64_editor
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          fail-on-cache-miss: true
          path: tmp-builds/out/
          key: tmp-bin-${{ github.run_id }}-ios-arm64-single-editor
      - name: Restore iOS arm64 Release
        id: cache_ios_arm64_release
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          fail-on-cache-miss: true
          path: tmp-builds/out/
          key: tmp-bin-${{ github.run_id }}-ios-arm64-single-template_release
      - name: Restore Web wasm32 Editor
        id: cache_web_wasm32_editor
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          fail-on-cache-miss: true
          path: tmp-builds/out/
          key: tmp-bin-${{ github.run_id }}-web-wasm32-single-editor
      - name: Restore Web wasm32 Release
        id: cache_web_wasm32_release
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          fail-on-cache-miss: true
          path: tmp-builds/out/
          key: tmp-bin-${{ github.run_id }}-web-wasm32-single-template_release

      - name: Require all build caches
        env:
          REQUIRED_CACHE_HITS: >-
            {
              "cache_windows_x86_64_editor": "${{ steps.cache_windows_x86_64_editor.outputs.cache-hit }}",
              "cache_windows_x86_64_release": "${{ steps.cache_windows_x86_64_release.outputs.cache-hit }}",
              "cache_linux_x86_64_editor": "${{ steps.cache_linux_x86_64_editor.outputs.cache-hit }}",
              "cache_linux_x86_64_release": "${{ steps.cache_linux_x86_64_release.outputs.cache-hit }}",
              "cache_linux_arm64_editor": "${{ steps.cache_linux_arm64_editor.outputs.cache-hit }}",
              "cache_linux_arm64_release": "${{ steps.cache_linux_arm64_release.outputs.cache-hit }}",
              "cache_macos_universal_editor": "${{ steps.cache_macos_universal_editor.outputs.cache-hit }}",
              "cache_macos_universal_release": "${{ steps.cache_macos_universal_release.outputs.cache-hit }}",
              "cache_android_arm64_editor": "${{ steps.cache_android_arm64_editor.outputs.cache-hit }}",
              "cache_android_arm64_release": "${{ steps.cache_android_arm64_release.outputs.cache-hit }}",
              "cache_android_x86_64_editor": "${{ steps.cache_android_x86_64_editor.outputs.cache-hit }}",
              "cache_android_x86_64_release": "${{ steps.cache_android_x86_64_release.outputs.cache-hit }}",
              "cache_ios_arm64_editor": "${{ steps.cache_ios_arm64_editor.outputs.cache-hit }}",
              "cache_ios_arm64_release": "${{ steps.cache_ios_arm64_release.outputs.cache-hit }}",
              "cache_web_wasm32_editor": "${{ steps.cache_web_wasm32_editor.outputs.cache-hit }}",
              "cache_web_wasm32_release": "${{ steps.cache_web_wasm32_release.outputs.cache-hit }}"
            }
        run: |
          python3 - <<'PY'
          import json
          import os

          hits = json.loads(os.environ["REQUIRED_CACHE_HITS"])
          missing = [name for name, hit in hits.items() if hit != "true"]
          if not hits or missing:
              raise SystemExit("::error::Missing required build caches: " + ", ".join(missing))
          PY

      - name: Setup Godot for Icon Generation
        run: |
          GODOT_VERSION="${{ env.GODOT_VERSION_FOR_EXPORT }}"
          echo "GODOT_VER_CLEAN=$(echo $GODOT_VERSION | cut -d '-' -f 1)" >> $GITHUB_ENV
          wget --tries=5 --waitretry=5 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip" -O godot.zip
          unzip godot.zip
          mv Godot_v${GODOT_VERSION}_linux.x86_64 godot.x86_64
          chmod +x godot.x86_64

      - name: Prepare Final Structure
        shell: bash
        run: |
          mkdir -p out/addons/${{ env.MODULE_NAME }}/bin # Ensure bin dir exists in out/
          mkdir -p out/addons/${{ env.MODULE_NAME }}/icons
          cp gdextension/* out/addons/${{ env.MODULE_NAME }}/ 2>/dev/null || true
          cp README.md README.pt.md release_note.md release_note.pt.md out/addons/${{ env.MODULE_NAME }}/ 2>/dev/null || true
          cp src/icons/*.svg out/addons/${{ env.MODULE_NAME }}/icons/ 2>/dev/null || true

          # Copy structure from repo (e.g., plugin.cfg if not in gdextension)
          cp -r addons/${{ env.MODULE_NAME }}/* out/addons/${{ env.MODULE_NAME }}/ 2>/dev/null || true

          # Copy all compiled binaries from the SCons build output
          # The SCons SConstruct places binaries in addons/<module_name>/bin/
          cp -r tmp-builds/out/addons/${{ env.MODULE_NAME }}/bin/* out/addons/${{ env.MODULE_NAME }}/bin/ 2>/dev/null || true
          echo "Copied all compiled libraries to out/addons/${{ env.MODULE_NAME }}/bin/"

          touch out/project.godot
          ./godot.x86_64 --headless --editor --path out/ --quit || true
          rm out/project.godot
          rm -rf out/.godot/
          # Fix icon imports for editor
          if [ -d out/addons/${{ env.MODULE_NAME }}/icons/ ]; then
            find out/addons/${{ env.MODULE_NAME }}/icons/ -maxdepth 1 -name "*.import" -exec sed -i 's|editor/scale_with_editor_scale=false|editor/scale_with_editor_scale=true|' {} +
            find out/addons/${{ env.MODULE_NAME }}/icons/ -maxdepth 1 -name "*.import" -exec sed -i 's|editor/convert_colors_with_editor_theme=false|editor/convert_colors_with_editor_theme=true|' {} +
          fi

      - name: Sync Addons for Commit
        run: |
          # Copy the fully prepared addons back into the repo structure
          cp -r out/addons/* addons/
          # Ensure binaries are force-added to bypass .gitignore if they are new or modified
          git add -f addons/${{ env.MODULE_NAME }}/bin/*


      - name: Auto-Commit Plugin Addons
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5
        with:
          branch: ${{ github.ref_name }}
          commit_message: "build: update compiled plugin binaries [skip ci]"
          file_pattern: "addons/"
          add_options: "-f"

      - name: Upload Final Plugin Artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ${{ env.PROJECT_ID }}+v${{ inputs.plugin_version }}.gdextension.zip
          path: out/addons/

      - name: Prepare Demo for Upload
        run: |
          # Create a clean demo directory including the plugin
          mkdir -p tmp-demo/demo
          cp -r demo/* tmp-demo/demo/
          mkdir -p tmp-demo/demo/addons
          cp -r out/addons/${{ env.MODULE_NAME }} tmp-demo/demo/addons/

      - name: Upload Final Demo Artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ${{ env.PROJECT_ID }}+v${{ inputs.plugin_version }}.demo.zip
          path: tmp-demo/demo/
