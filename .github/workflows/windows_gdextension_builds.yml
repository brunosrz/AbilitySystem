name: 🏁 Windows GDExtension

on:
  workflow_call:
    inputs:
      plugin-version:
        required: true
        type: string
      godot-cpp-version:
        required: true
        type: string
  workflow_dispatch:

jobs:
  build:
    name: 🧩 GDExtension (${{ matrix.target }}, ${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [editor, template_release]
        arch: [x86_64]
        float-precision: [single]

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive

      - name: Import dependency versions
        shell: bash
        run: |
          grep -v '^#' deps.env | grep -v '^$' >> "$GITHUB_ENV"

      - name: Fetch godot-cpp
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: godotengine/godot-cpp
          ref: ${{ inputs.godot-cpp-version }}
          path: godot-cpp
          submodules: recursive


      - name: Setup godot-cpp
        uses: ./godot-cpp/.github/actions/setup-godot-cpp
        with:
          platform: windows
          windows-compiler: "msvc"

      - name: Restore .scons_cache
        uses: ./.github/actions/zyris-cache-restore
        with:
          scons-cache: ${{ github.workspace }}/.scons_cache
          cache-name: gdext_windows_${{ matrix.arch }}_${{ matrix.target }}_engine-${{ env.GODOT_VERSION }}
          enable-cross-os-archive: true

      - name: Build GDExtension (Windows Target)
        shell: bash
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons_cache
        run: |
          # Enable tests for editor builds
          EXTRA_ARGS=""
          if [[ "${{ matrix.target }}" == "editor" ]]; then
            EXTRA_ARGS="tests=yes"
          fi
          scons target=${{ matrix.target }} platform=windows arch=${{ matrix.arch }} precision=${{ matrix.float-precision }} $EXTRA_ARGS

      - name: Save .scons_cache
        uses: ./.github/actions/zyris-cache-save
        with:
          scons-cache: ${{ github.workspace }}/.scons_cache
          cache-name: gdext_windows_${{ matrix.arch }}_${{ matrix.target }}_engine-${{ env.GODOT_VERSION }}
          enable-cross-os-archive: true

      - name: Prepare Plugin Structure
        shell: bash
        run: |
          mkdir -p tmp-builds/out/addons/${{ env.MODULE_NAME }}/bin
          mkdir -p tmp-builds/out/addons/${{ env.MODULE_NAME }}/icons
          cp gdextension/* tmp-builds/out/addons/${{ env.MODULE_NAME }}/ 2>/dev/null || true
          cp README.md README.pt.md release_note.md release_note.pt.md tmp-builds/out/addons/${{ env.MODULE_NAME }}/ 2>/dev/null || true
          cp src/icons/*.svg tmp-builds/out/addons/${{ env.MODULE_NAME }}/icons/ 2>/dev/null || true
          find addons/${{ env.MODULE_NAME }}/bin/ -maxdepth 1 \( -name "*.dll" -o -name "*.pdb" \) -exec cp {} tmp-builds/out/addons/${{ env.MODULE_NAME }}/bin/ \;
          find tmp-builds/out/addons/${{ env.MODULE_NAME }}/bin/ -maxdepth 1 \( -name "*.exp" -o -name "*.lib" \) -delete

      - name: Cache Build for Packaging
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          enableCrossOsArchive: true
          path: tmp-builds/out/
          key: tmp-bin-${{ github.run_id }}-windows-${{ matrix.arch }}-${{ matrix.float-precision }}-${{ matrix.target }}
